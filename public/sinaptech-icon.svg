<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Máscara para manter o interior dos nós vazados e as junções perfeitas -->
    <mask id="hollow-nodes">
      <rect width="100" height="100" fill="white" />
      <!-- Máscaras dos Nós Superiores -->
      <circle cx="24" cy="35" r="6" fill="black" />
      <circle cx="50" cy="20" r="6" fill="black" />
      <circle cx="76" cy="35" r="6" fill="black" />
      <!-- Máscaras dos Nós Inferiores -->
      <circle cx="24" cy="65" r="6" fill="black" />
      <circle cx="50" cy="80" r="6" fill="black" />
      <circle cx="76" cy="65" r="6" fill="black" />
      <circle cx="50" cy="50" r="6" fill="black" />
    </mask>

    <!-- Gradiente Superior (Verde Água/Ciano) -->
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2bb189"/>
      <stop offset="100%" stop-color="#3ddc97"/>
    </linearGradient>

    <!-- Gradiente Inferior (Verde Escuro) -->
    <linearGradient id="bottomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a22"/>
      <stop offset="100%" stop-color="#125142"/>
    </linearGradient>
  </defs>

  <!-- Linhas Conectoras -->
  <g stroke-linecap="round" stroke-linejoin="round" mask="url(#hollow-nodes)" fill="none">
    <!-- Caminho Superior -->
    <polyline points="24,35 50,20 76,35" stroke="url(#topGradient)" stroke-width="4.5" />
    <!-- Caminho Inferior -->
    <polyline points="24,65 50,80 76,65 50,50" stroke="url(#bottomGradient)" stroke-width="4.5" />
  </g>

  <!-- Nós (Anéis) desenhados por cima -->
  <g stroke-width="4.5" fill="none">
    <!-- Topo -->
    <circle cx="24" cy="35" r="6" stroke="url(#topGradient)" />
    <circle cx="50" cy="20" r="6" stroke="url(#topGradient)" />
    <circle cx="76" cy="35" r="6" stroke="url(#topGradient)" />

    <!-- Base -->
    <circle cx="24" cy="65" r="6" stroke="url(#bottomGradient)" />
    <circle cx="50" cy="80" r="6" stroke="url(#bottomGradient)" />
    <circle cx="76" cy="65" r="6" stroke="url(#bottomGradient)" />
    <circle cx="50" cy="50" r="6" stroke="url(#bottomGradient)" />
  </g>
</svg>
