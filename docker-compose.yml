services:
  postgres:
    image: postgres:16-alpine
    container_name: sinaptech-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: sinaptech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}
      POSTGRES_DB: sinaptech_landing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinaptech -d sinaptech_landing"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
